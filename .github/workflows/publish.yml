name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          node --version
          npm --version

      - name: Resolve version from package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "package.json version: $version (tag: v$version)"

      - name: Check whether this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          name="$(node -p "require('./package.json').name")"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to do."
          elif npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; creating the missing release only."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new; will publish and release."
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.release == 'true'
        run: npm ci

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish

      - name: Package bundle
        if: steps.check.outputs.release == 'true'
        run: |
          if [ ! -d bundle/mcpexplorer ]; then npm run bundle; fi
          cd bundle/mcpexplorer
          zip -r "../../mcpexplorer-bundle-${{ steps.version.outputs.tag }}.zip" .

      - name: Create GitHub release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "mcpexplorer-bundle-${{ steps.version.outputs.tag }}.zip" \
            --target "$GITHUB_SHA" \
            --generate-notes
