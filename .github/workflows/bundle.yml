name: Bundle

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpexplorer-bundle
          path: bundle/mcpexplorer/
          if-no-files-found: error
          retention-days: 30
